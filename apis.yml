aid: greenhouse-io
url: https://raw.githubusercontent.com/api-evangelist/greenhouse-io/refs/heads/main/apis.yml
apis:
- aid: greenhouse-io:greenhouse-harvest-api
  name: Greenhouse Harvest API
  tags:
  - ATS
  - Recruiting
  - Candidates
  - Jobs
  - Interviews
  - Offers
  humanURL: https://developers.greenhouse.io/harvest.html
  baseURL: https://harvest.greenhouse.io/v1
  properties:
  - url: https://developers.greenhouse.io/harvest.html
    type: Documentation
  - url: openapi/greenhouse-harvest-api-openapi.yml
    type: OpenAPI
  - url: json-schema/greenhouse-candidate-schema.json
    type: JSONSchema
  - url: json-schema/greenhouse-job-schema.json
    type: JSONSchema
  - url: json-ld/greenhouse-io-context.jsonld
    type: JSONLD
  - type: Authentication
    name: HTTP Basic with API key as username
    url: https://developers.greenhouse.io/harvest.html#authentication
  - type: Pagination
    name: RFC-5988 Link headers (next, prev, last); per_page default 100, max 500
    url: https://developers.greenhouse.io/harvest.html#pagination
  - type: RateLimits
    url: https://developers.greenhouse.io/harvest.html#rate-limits
  description: |
    The Harvest API is Greenhouse's primary REST API and source of truth for recruiting data:
    candidates, applications, jobs, openings, job posts, job stages, departments, offices,
    users, offers, approval flows, scheduled interviews, scorecards, sources, tags, custom
    fields, prospect pools, rejection reasons, and the per-candidate activity feed.
    HTTP Basic with a granular per-permission API key; RFC-5988 Link pagination; rate limits
    returned in X-RateLimit-Limit per 10s.
- aid: greenhouse-io:greenhouse-job-board-api
  name: Greenhouse Job Board API
  tags:
  - JobBoard
  - Careers
  - Public
  - Applications
  humanURL: https://developers.greenhouse.io/job-board.html
  baseURL: https://boards-api.greenhouse.io/v1/boards/{board_token}
  properties:
  - url: https://developers.greenhouse.io/job-board.html
    type: Documentation
  - url: openapi/greenhouse-job-board-api-openapi.yml
    type: OpenAPI
  - type: Authentication
    name: Public GET (no auth) + Basic auth for application POST
    url: https://developers.greenhouse.io/job-board.html
  description: |
    The Job Board API exposes a customer's public career site data — jobs, departments,
    offices — and accepts application submissions via POST /jobs/{id}. GET endpoints are
    unauthenticated; POST endpoints accept multipart/form-data or JSON. Used to power
    customer-owned career pages and third-party job-board syndication.
- aid: greenhouse-io:greenhouse-audit-log-api
  name: Greenhouse Audit Log API
  tags:
  - AuditLog
  - Compliance
  - Security
  - Governance
  - Enterprise
  humanURL: https://developers.greenhouse.io/audit-log.html
  baseURL: https://auditlog.us.greenhouse.io
  properties:
  - url: https://developers.greenhouse.io/audit-log.html
    type: Documentation
  - url: openapi/greenhouse-audit-log-api-openapi.yml
    type: OpenAPI
  - type: Authentication
    name: JWT bearer token obtained from POST /auth/jwt_access_token on harvest.greenhouse.io
  - type: RateLimits
    name: 50 req / 10s standard; 3 req / 30s for paginated reads
    url: https://developers.greenhouse.io/audit-log.html
  - type: Retention
    name: 30 days
  description: |
    The Audit Log API exposes important administrative events from the prior 30 days for
    governance, compliance, and incident response. JWT bearer authentication (24h validity)
    issued from the Harvest /auth/jwt_access_token endpoint. Pro-tier offering.
- aid: greenhouse-io:greenhouse-candidate-ingestion-api
  name: Greenhouse Candidate Ingestion (Partner) API
  tags:
  - Partner
  - Ingestion
  - Sourcing
  - Candidates
  - Prospects
  humanURL: https://developers.greenhouse.io/candidate-ingestion.html
  baseURL: https://api.greenhouse.io/v1/partner
  properties:
  - url: https://developers.greenhouse.io/candidate-ingestion.html
    type: Documentation
  - url: openapi/greenhouse-candidate-ingestion-api-openapi.yml
    type: OpenAPI
  - type: Authentication
    name: OAuth 2.0 (Authorization Code or Client Credentials) or HTTP Basic with On-Behalf-Of header
    url: https://developers.greenhouse.io/candidate-ingestion.html
  description: |
    The Candidate Ingestion (Partner) API lets sourcing partners create candidates and
    prospects in a customer's Greenhouse account, list jobs visible to the integrated user,
    read prospect pools, retrieve the current user, and generate branded tracking links.
    Used by sourcing platforms, agencies, and recruitment marketing tools.
- aid: greenhouse-io:greenhouse-onboarding-api
  name: Greenhouse Onboarding API
  tags:
  - Onboarding
  - HRIS
  - GraphQL
  - Employees
  humanURL: https://developers.greenhouse.io/gho.html
  baseURL: https://onboarding-api.greenhouse.io/graphql
  properties:
  - url: https://developers.greenhouse.io/gho.html
    type: Documentation
  - url: openapi/greenhouse-onboarding-api-openapi.yml
    type: OpenAPI
  - type: Authentication
    name: HTTP Basic with Access Key (username) and Secret Key (password); Super Admin issued
  - type: RateLimits
    name: >-
      100 requests per window + 2500-point query-complexity ceiling; rateLimit GraphQL field exposes remaining
      budget
    url: https://developers.greenhouse.io/gho.html
  - url: graphql/greenhouse-io-graphql.md
    type: GraphQL
  description: |
    The Greenhouse Onboarding (GHO) API is a single GraphQL endpoint covering employees,
    departments, locations, teams, custom fields, and mutations such as addPendingHire and
    updateEmployeeProfile. Available on the Plus and Pro tiers; requires Super Admin to
    generate or revoke keys.
- aid: greenhouse-io:greenhouse-assessment-api
  name: Greenhouse Assessment Partner API
  tags:
  - Assessment
  - Partner
  - PreHire
  - Integrations
  humanURL: https://developers.greenhouse.io/assessment.html
  properties:
  - url: https://developers.greenhouse.io/assessment.html
    type: Documentation
  - url: openapi/greenhouse-assessment-api-openapi.yml
    type: OpenAPI
  - type: Authentication
    name: HTTP Basic over HTTPS; partner-hosted endpoints; API keys must be <171 chars
  description: |
    The Assessment Partner API defines the four endpoints — list_tests, send_test,
    test_status, response_error — that assessment vendors implement so Greenhouse can
    dispatch a test to a candidate and retrieve completion details. Partner-hosted rather
    than Greenhouse-hosted; results retrieved via PATCH callback or hourly polling for
    up to 8 weeks.
- aid: greenhouse-io:greenhouse-recruiting-webhooks
  name: Greenhouse Recruiting Webhooks
  tags:
  - Webhooks
  - Events
  - Recruiting
  humanURL: https://developers.greenhouse.io/webhooks.html
  properties:
  - url: https://developers.greenhouse.io/webhooks.html
    type: Documentation
  - type: Authentication
    name: HMAC SHA-256 signature header verified against the secret key and JSON body (Unicode-escaped)
  - type: Retry
    name: Up to 7 retries over ~15h with exponential backoff
  - type: Events
    data:
    - candidate_hired
    - candidate_rejected
    - candidate_unrejected
    - candidate_stage_change
    - candidate_merged
    - candidate_anonymized
    - application_created
    - application_deleted
    - application_updated
    - prospect_created
    - prospect_updated
    - prospect_rejected
    - offer_created
    - offer_updated
    - interview_deleted
    - scorecard_deleted
    - job_created
    - job_updated
    - job_approved
    - job_post_created
    - department_deleted
    - office_deleted
  description: |
    Event-driven webhooks from Greenhouse Recruiting. Greenhouse POSTs JSON to your HTTPS
    endpoint on each event; payloads carry a Greenhouse-Event-ID header for idempotency and
    HMAC SHA-256 signature verification.
- aid: greenhouse-io:greenhouse-onboarding-webhooks
  name: Greenhouse Onboarding Webhooks
  tags:
  - Webhooks
  - Events
  - Onboarding
  - Beta
  humanURL: https://developers.greenhouse.io/onboarding_webhooks.html
  properties:
  - url: https://developers.greenhouse.io/onboarding_webhooks.html
    type: Documentation
  - type: Authentication
    name: HMAC SHA-256 signature header
  - type: Retry
    name: Up to 7 retries over ~15h with exponential backoff
  - type: Events
    data:
    - employee_updated
  description: |
    Event-driven webhooks from Greenhouse Onboarding (currently in beta and gated by
    customer approval). Each event posts event_type, id, and payload to the customer's
    HTTPS endpoint; signatures use HMAC SHA-256 with a shared secret.
