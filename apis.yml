apis:
- aid: greenhouse-io:greenhouse-recruiting-webhooks
  name: Greenhouse Recruiting Webhooks
  tags:
  - Webhook
  - Event
  - Recruiting
  tags_raw:
  - Webhooks
  - Events
  - Recruiting
  humanURL: https://developers.greenhouse.io/webhooks.html
  properties:
  - url: https://developers.greenhouse.io/webhooks.html
    type: Documentation
  - type: Authentication
    name: >-
      HMAC SHA-256 signature header verified against the secret key and JSON body (Unicode-escaped)
  - type: Retry
    name: Up to 7 retries over ~15h with exponential backoff
  - type: Events
    data:
    - candidate_hired
    - candidate_rejected
    - candidate_unrejected
    - candidate_stage_change
    - candidate_merged
    - candidate_anonymized
    - application_created
    - application_deleted
    - application_updated
    - prospect_created
    - prospect_updated
    - prospect_rejected
    - offer_created
    - offer_updated
    - interview_deleted
    - scorecard_deleted
    - job_created
    - job_updated
    - job_approved
    - job_post_created
    - department_deleted
    - office_deleted
  description: >
    Event-driven webhooks from Greenhouse Recruiting. Greenhouse POSTs JSON to your HTTPS

    endpoint on each event; payloads carry a Greenhouse-Event-ID header for idempotency and

    HMAC SHA-256 signature verification.
- aid: greenhouse-io:greenhouse-onboarding-webhooks
  name: Greenhouse Onboarding Webhooks
  tags:
  - Webhook
  - Event
  - Onboarding
  - Beta
  tags_raw:
  - Webhooks
  - Events
  - Onboarding
  - Beta
  humanURL: https://developers.greenhouse.io/onboarding_webhooks.html
  properties:
  - url: https://developers.greenhouse.io/onboarding_webhooks.html
    type: Documentation
  - type: Authentication
    name: HMAC SHA-256 signature header
  - type: Retry
    name: Up to 7 retries over ~15h with exponential backoff
  - type: Events
    data:
    - employee_updated
  description: >
    Event-driven webhooks from Greenhouse Onboarding (currently in beta and gated by

    customer approval). Each event posts event_type, id, and payload to the customer's

    HTTPS endpoint; signatures use HMAC SHA-256 with a shared secret.
